name: Build TizenTube Standalone and Release

on:
  workflow_dispatch:
  push:
    branches: 
      - main

env:
  TIZEN_STUDIO_VER: 5.6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy local userScript into standalone service
        run: |
          mkdir -p standalone/service/scripts
          if [ -f service/scripts/userScript.js ]; then
            cp service/scripts/userScript.js standalone/service/scripts/userScript.js
            echo "✅ Đã copy thành công userScript.js vào thư mục standalone/service/scripts/"
          else
            echo "⚠️ Cảnh báo: Không tìm thấy file service/scripts/userScript.js trong repo!"
            exit 1
          fi

      # ---------------------------------------------------------------
      # [Từ bản FORK] Tải và cài Tizen Studio CLI
      # ---------------------------------------------------------------
      - name: Download and Install Tizen Studio CLI
        run: |
          set -euo pipefail
          curl -fL -o tizen-installer "https://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VER}/web-cli_Tizen_Studio_${TIZEN_STUDIO_VER}_ubuntu-64.bin"
          chmod +x tizen-installer
          ./tizen-installer --accept-license "${GITHUB_WORKSPACE}/tizen-studio"
          rm ./tizen-installer
          echo "${GITHUB_WORKSPACE}/tizen-studio/tools/ide/bin" >> $GITHUB_PATH
          export PATH="${GITHUB_WORKSPACE}/tizen-studio/tools/ide/bin:$PATH"

      # ---------------------------------------------------------------
      # [Từ bản FORK] Chuẩn bị chứng chỉ + profile ký của Tizen Studio.
      # Thêm so với FORK:
      #   - nếu thiếu secret TIZEN_AUTHOR_KEY nhưng repo có sẵn TizenTube-author.p12
      #     (như bản ORIGINAL vẫn đang dùng) thì dùng file đó, chỉ khi không có cả hai mới tự sinh chứng chỉ tạm
      #   - xuất mật khẩu ra TIZEN_AUTHOR_PW để các bước build tizenjs dùng chung đúng chứng chỉ này
      # ---------------------------------------------------------------
      - name: Configure Certificate and Profile
        env:
          AUTHOR_P12_B64: ${{ secrets.TIZEN_AUTHOR_KEY }}
          AUTHOR_P12_PASSWORD: ${{ secrets.TIZEN_AUTHOR_KEY_PW }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/tizen-data/keystore/author"
          mkdir -p "${GITHUB_WORKSPACE}/tizen-data/profile"

          KEYSTORE="${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12"
          REPO_P12="${GITHUB_WORKSPACE}/TizenTube-author.p12"
          NEED_CONVERT=0

          # 1. Giải mã chứng chỉ thật từ Secret, hoặc dùng p12 có sẵn trong repo, hoặc tự sinh chứng chỉ tạm thời
          if [ -n "${AUTHOR_P12_B64:-}" ]; then
            echo "✅ Đã tìm thấy TIZEN_AUTHOR_KEY secret. Đang giải mã..."
            FINAL_PW="${AUTHOR_P12_PASSWORD}"
            echo "$AUTHOR_P12_B64" | base64 -d > "$KEYSTORE"
            NEED_CONVERT=1
          elif [ -f "$REPO_P12" ]; then
            echo "✅ Không có TIZEN_AUTHOR_KEY secret, dùng TizenTube-author.p12 có sẵn trong repo..."
            FINAL_PW="${AUTHOR_P12_PASSWORD}"
            cp "$REPO_P12" "$KEYSTORE"
            NEED_CONVERT=1
          else
            echo "⚠️ Không tìm thấy TIZEN_AUTHOR_KEY secret lẫn TizenTube-author.p12. Khởi tạo chứng chỉ self-signed tạm thời..."
            FINAL_PW="password123"
            openssl req -x509 -newkey rsa:2048 -keyout /tmp/author.key -out /tmp/author.crt -days 3650 -nodes -subj "/CN=TizenTubeDev/O=TizenTube/C=US"
            openssl pkcs12 -export -out "$KEYSTORE" -inkey /tmp/author.key -in /tmp/author.crt -passout pass:"$FINAL_PW" -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
            rm -f /tmp/author.key /tmp/author.crt
          fi

          if [ "$NEED_CONVERT" = "1" ]; then
            # Convert chuẩn mã hóa tương thích tuyệt đối với Tizen CLI
            openssl pkcs12 -legacy -in "$KEYSTORE" -out /tmp/author-intermediate.pem -nodes -passin pass:"$FINAL_PW" || \
            openssl pkcs12 -in "$KEYSTORE" -out /tmp/author-intermediate.pem -nodes -passin pass:"$FINAL_PW"

            openssl pkcs12 -export -legacy -in /tmp/author-intermediate.pem -passout pass:"$FINAL_PW" -out "$KEYSTORE" -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
            rm -f /tmp/author-intermediate.pem
          fi

          # Chia sẻ mật khẩu cho các bước sau (được che trong log)
          echo "::add-mask::${FINAL_PW}"
          echo "TIZEN_AUTHOR_PW=${FINAL_PW}" >> "$GITHUB_ENV"

          # 2. Tạo trực tiếp file profiles.xml chuẩn để cấu hình ký chứng chỉ
          cat << EOF > "${GITHUB_WORKSPACE}/tizen-data/profile/profiles.xml"
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <profiles active="TizenTubeStandalone" version="3.1">
            <profile name="TizenTubeStandalone">
              <profileitem
                ca="${GITHUB_WORKSPACE}/tizen-studio/tools/certificate-generator/certificates/developer/tizen-developer-ca.cer"
                distributor="0"
                key="${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12"
                password="${FINAL_PW}"
                rootca=""/>
              <profileitem
                ca="${GITHUB_WORKSPACE}/tizen-studio/tools/certificate-generator/certificates/distributor/sdk-public/tizen-distributor-ca.cer"
                distributor="1"
                key="${GITHUB_WORKSPACE}/tizen-studio/tools/certificate-generator/certificates/distributor/sdk-public/tizen-distributor-signer.p12"
                password="tizenpkcs12passfordsigner"
                rootca=""/>
              <profileitem ca="" distributor="2" key="" password="" rootca=""/>
            </profile>
          </profiles>
          EOF

          tizen cli-config "profiles.path=${GITHUB_WORKSPACE}/tizen-data/profile/profiles.xml"

      - name: Install modules, transpile service and build service for DIAL
        working-directory: service
        run: |
          npm install
          npx rollup -c rollup.config.js

      - name: Install modules, transpile service and build service
        working-directory: standalone/service
        run: |
          npm install
          npm install -g @vercel/ncc https://github.com/reisxd/tizen.js/tarball/main
          npm run build

      # tizenjs vẫn cần file p12 ở gốc workspace: lấy đúng chứng chỉ vừa cấu hình ở trên
      - name: Prepare Tizen Certificate
        run: |
          cp "${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12" "${GITHUB_WORKSPACE}/TizenTube-author.p12"

      # Các bước build tizenjs bên dưới giữ nguyên như bản ORIGINAL,
      # chỉ thay '${{ secrets.TIZEN_AUTHOR_KEY_PW }}' bằng "${TIZEN_AUTHOR_PW}" (mật khẩu của chứng chỉ ở trên)
      - name: Build TizenTube Cobalt
        working-directory: standalone
        run: |
          mkdir release
          tizenjs build . -t wgt -o release/TizenTubeCobalt.wgt --author "${GITHUB_WORKSPACE}/TizenTube-author.p12" --authorPwd "${TIZEN_AUTHOR_PW}" -p public --ignore node_modules,/.*\.wgt$/,/userwidget/,/release/

      - name: Change config.xml to use http://tizentube:8101 as the proxy server for Cobalt
        working-directory: standalone/service
        run: |
          node build-service.js set-cobalt-proxy

      - name: Build TizenTube Cobalt with http://tizentube:8101 as the proxy server
        working-directory: standalone
        run: |
          tizenjs build . -t wgt -o release/TizenTubeCobaltTizenTubeProxyAddress.wgt --author "${GITHUB_WORKSPACE}/TizenTube-author.p12" --authorPwd "${TIZEN_AUTHOR_PW}" -p public --ignore node_modules,/.*\.wgt$/,/userwidget/,/release/

      - name: Remove Cobalt flags from config.xml for Old Tizen build
        working-directory: standalone/service
        run: |
          node build-service.js remove-cobalt-flags

      - name: Build TizenTube For Old Tizen (without Cobalt)
        working-directory: standalone
        run: |
          tizenjs build . -t wgt -o release/TizenTubeOld.wgt --author "${GITHUB_WORKSPACE}/TizenTube-author.p12" --authorPwd "${TIZEN_AUTHOR_PW}" -p public --ignore node_modules,/.*\.wgt$/,/userwidget/,/release/

      # Với MỖI file .wgt tizenjs vừa build (Cobalt / CobaltTizenTubeProxyAddress / Old) tạo ra 2 file xuất:
      #   <tên>-unsigned.wgt : cùng nội dung, đã bỏ các file chữ ký
      #   <tên>-signed.wgt   : ký lại bằng profile Tizen Studio (TizenTubeStandalone)
      # File .wgt trung gian của tizenjs bị xoá, release chỉ còn các file -signed / -unsigned.
      - name: Create unsigned and signed packages
        working-directory: standalone/release
        run: |
          set -euo pipefail
          shopt -s nullglob

          cat > /tmp/strip_signature.py <<'PY'
          import re, sys, zipfile
          src, dst = sys.argv[1], sys.argv[2]
          sig = re.compile(r'^(author-)?signature\d*\.xml$')
          removed = []
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  if sig.match(item.filename):
                      removed.append(item.filename)
                      continue
                  zout.writestr(item, zin.read(item.filename))
          print('Removed signature files:', removed if removed else 'none')
          PY

          BASE_WGTS=(*.wgt)
          if [ ${#BASE_WGTS[@]} -eq 0 ]; then
            echo "::error::Không có file .wgt nào trong standalone/release!"
            exit 1
          fi

          for BASE_WGT in "${BASE_WGTS[@]}"; do
            NAME="${BASE_WGT%.wgt}"
            UNSIGNED_WGT="${NAME}-unsigned.wgt"
            SIGNED_WGT="${NAME}-signed.wgt"
            WORK_DIR="/tmp/wgt-build-${NAME}"
            echo "=== ${BASE_WGT} -> ${UNSIGNED_WGT} + ${SIGNED_WGT} ==="

            # 1) Bản KHÔNG chữ ký: sao chép gói và loại bỏ file chữ ký ở thư mục gốc của wgt
            python3 /tmp/strip_signature.py "$BASE_WGT" "$UNSIGNED_WGT"
            # (đọc danh sách vào biến trước, vì `grep -q` thoát sớm sẽ làm `unzip | grep` fail khi bật pipefail)
            UNSIGNED_LIST="$(unzip -Z1 "$UNSIGNED_WGT")"
            if grep -Eq '^(author-)?signature[0-9]*\.xml$' <<< "$UNSIGNED_LIST"; then
              echo "::error::${UNSIGNED_WGT} vẫn còn file chữ ký!"
              exit 1
            fi

            # 2) Bản CÓ chữ ký: giải nén bản unsigned rồi đóng gói + ký bằng Tizen Studio
            rm -rf "$WORK_DIR" && mkdir -p "$WORK_DIR"
            unzip -q "$UNSIGNED_WGT" -d "$WORK_DIR"
            (cd "$WORK_DIR" && tizen package -t wgt -s TizenTubeStandalone -- ./)
            SIGNED_SRC="$(ls "$WORK_DIR"/*.wgt | head -n 1)"
            cp "$SIGNED_SRC" "$SIGNED_WGT"
            rm -rf "$WORK_DIR"

            SIGNED_LIST="$(unzip -Z1 "$SIGNED_WGT")"
            if ! grep -Eq '^author-signature\.xml$' <<< "$SIGNED_LIST"; then
              echo "::error::${SIGNED_WGT} không có author-signature.xml!"
              exit 1
            fi

            # Bỏ gói trung gian của tizenjs
            rm -f "$BASE_WGT"
          done

          ls -la

      - name: Upload TizenTube package (signed + unsigned)
        uses: actions/upload-artifact@v4
        with:
            name: TizenTubeSamsung
            path: standalone/release/*
            if-no-files-found: error