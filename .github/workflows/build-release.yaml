name: Build TizenTube Standalone and Release


on:
  workflow_dispatch:
  push:
    branches: 
      - main

env:
  TIZEN_STUDIO_VER: 5.6

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install modules, transpile service and build service for DIAL
        working-directory: service
        run: |
          npm install
          npx rollup -c rollup.config.js

      - name: Install modules, transpile service and build service
        working-directory: standalone/service
        run: |
          npm install
          npm install -g @vercel/ncc
          npm run build

      - name: Download Tizen Studio CLI
        run: |
          set -euo pipefail
          curl -fL -o tizen-installer "https://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VER}/web-cli_Tizen_Studio_${TIZEN_STUDIO_VER}_ubuntu-64.bin"
          chmod +x tizen-installer

      - name: Install Tizen Studio CLI
        run: |
          set -euo pipefail
          ./tizen-installer --accept-license "${GITHUB_WORKSPACE}/tizen-studio"
          rm ./tizen-installer
          echo "${GITHUB_WORKSPACE}/tizen-studio/tools/ide/bin" >> $GITHUB_PATH

      - name: Configure certificate profile
        env:
          AUTHOR_P12_B64: ${{ secrets.TIZEN_AUTHOR_KEY }}
          AUTHOR_P12_PASSWORD: ${{ secrets.TIZEN_AUTHOR_KEY_PW }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/tizen-data/keystore/author"
          mkdir -p "${GITHUB_WORKSPACE}/tizen-data/profile"

          # 1. Tự động sinh chứng chỉ giả lập nếu thiếu Secret hoặc giải mã chứng chỉ thật
          if [ -z "${AUTHOR_P12_B64:-}" ]; then
            echo "⚠️ Không tìm thấy TIZEN_AUTHOR_KEY secret. Tự động khởi tạo chứng chỉ self-signed..."
            FINAL_PW="password123"
            
            openssl req -x509 -newkey rsa:2048 -keyout /tmp/author.key -out /tmp/author.crt -days 3650 -nodes -subj "/CN=TizenTubeDev/O=TizenTube/C=US"
            openssl pkcs12 -export -out "${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12" -inkey /tmp/author.key -in /tmp/author.crt -passout pass:"$FINAL_PW" -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
            rm -f /tmp/author.key /tmp/author.crt
          else
            echo "✅ Đã tìm thấy TIZEN_AUTHOR_KEY secret. Đang giải mã..."
            FINAL_PW="${AUTHOR_P12_PASSWORD}"
            echo "$AUTHOR_P12_B64" | base64 -d > "${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12"

            # Convert chuẩn mã hóa tương thích Tizen CLI
            openssl pkcs12 -legacy -in "${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12" -out /tmp/author-intermediate.pem -nodes -passin pass:"$FINAL_PW" || \
            openssl pkcs12 -in "${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12" -out /tmp/author-intermediate.pem -nodes -passin pass:"$FINAL_PW"
            
            openssl pkcs12 -export -legacy -in /tmp/author-intermediate.pem -passout pass:"$FINAL_PW" -out "${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12" -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
            rm -f /tmp/author-intermediate.pem
          fi

          # 2. Cập nhật profiles.xml
          cp .github/assets/profiles.xml "${GITHUB_WORKSPACE}/tizen-data/profile/profiles.xml"
          python3 -c "from pathlib import Path; import os; from xml.sax.saxutils import escape; p=Path(os.environ['GITHUB_WORKSPACE'])/'tizen-data/profile/profiles.xml'; t=p.read_text(); t=t.replace('\$GITHUB_WORKSPACE', os.environ['GITHUB_WORKSPACE']).replace('\$KEY_PW', escape('${FINAL_PW}', {'\"':'&quot;'})); p.write_text(t)"

          tizen cli-config "profiles.path=${GITHUB_WORKSPACE}/tizen-data/profile/profiles.xml"

      # --- BIẾN THỂ 1: TizenTube Cobalt Chuẩn ---
      - name: Build web app (Standard Cobalt)
        working-directory: standalone
        run: >
          tizen build-web
          -e "service/index.js"
          -e "service/injector.js"
          -e "service/bootstrap.js"
          -e "service/build-service.js"
          -e "service/package.json"
          -e "service/package-lock.json"
          -e "service/node_modules"
          -e "release"

      - name: Package TizenTube Cobalt WGT
        working-directory: standalone
        run: |
          set -euo pipefail
          mkdir -p release
          tizen package -t wgt -s TizenTubeStandalone -- ./
          cp *.wgt release/TizenTubeCobalt.wgt
          rm -f *.wgt

      # --- BIẾN THỂ 2: TizenTube Cobalt Proxy ---
      - name: Change config.xml to use proxy server for Cobalt
        working-directory: standalone/service
        run: |
          node build-service.js set-cobalt-proxy

      - name: Build web app (Proxy Variant)
        working-directory: standalone
        run: >
          tizen build-web
          -e "service/index.js"
          -e "service/injector.js"
          -e "service/bootstrap.js"
          -e "service/build-service.js"
          -e "service/package.json"
          -e "service/package-lock.json"
          -e "service/node_modules"
          -e "release"

      - name: Package Proxy WGT
        working-directory: standalone
        run: |
          set -euo pipefail
          tizen package -t wgt -s TizenTubeStandalone -- ./
          cp *.wgt release/TizenTubeCobaltTizenTubeProxyAddress.wgt
          rm -f *.wgt

      # --- BIẾN THỂ 3: Old Tizen (Không Cobalt) ---
      - name: Remove Cobalt flags from config.xml for Old Tizen build
        working-directory: standalone/service
        run: |
          node build-service.js remove-cobalt-flags

      - name: Build web app (Old Tizen Variant)
        working-directory: standalone
        run: >
          tizen build-web
          -e "service/index.js"
          -e "service/injector.js"
          -e "service/bootstrap.js"
          -e "service/build-service.js"
          -e "service/package.json"
          -e "service/package-lock.json"
          -e "service/node_modules"
          -e "release"

      - name: Package Old Tizen WGT
        working-directory: standalone
        run: |
          set -euo pipefail
          tizen package -t wgt -s TizenTubeStandalone -- ./
          cp *.wgt release/TizenTubeOld.wgt
          rm -f *.wgt

      - name: Show Tizen CLI log on failure
        if: failure()
        run: |
          LOG_PATH="${GITHUB_WORKSPACE}/tizen-studio-data/cli/logs/cli.log"
          if [ -f "$LOG_PATH" ]; then
            echo "--- tizen cli.log ---"
            cat "$LOG_PATH"
          else
            echo "No cli.log found at $LOG_PATH"
          fi

      - name: Upload TizenTube package artifact
        uses: actions/upload-artifact@v4
        with:
          name: TizenTube-Built
          path: standalone/release/*
          if-no-files-found: error